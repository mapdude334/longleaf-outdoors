<!doctype html><html><meta charset="utf-8"><title>Species card checks</title><h1>Species card checks</h1><pre id="results">Running…</pre><script type="module">
import { SPECIES } from '/src/species-data.ts';
import { speciesForLabel, speciesHtml } from '/src/species.ts';
import { gaugeName } from '/src/layers/gauges.ts';
const lines=[],check=(v,msg)=>{if(!v)throw Error(msg);lines.push('PASS: '+msg);};
try {
  const waters=await (await fetch('/data/waters.json')).json();
  const labels=[...new Set(waters.waters.flatMap(w=>w.species.map(s=>s.name)))];
  check(labels.every(n=>speciesForLabel(n).length>0),'All '+labels.length+' lake species labels resolve to fact cards');
  check(speciesForLabel('Black & white crappie').length===2,'Combined crappie label provides two distinct species');
  check(speciesForLabel('Striped bass (seasonal)')[0].id==='striped-bass','Seasonal striped bass alias resolves correctly');
  for(const s of SPECIES){
    const html=speciesHtml(s.id),doc=new DOMParser().parseFromString(html,'text/html');
    check(doc.querySelectorAll('.fish-facts dt').length===4,s.name+': spawning, diet, habitat and habits present');
    const image=doc.querySelector('img');check(!!image,s.name+': credited photograph is included');
    await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{if(im.naturalWidth>0)resolve();else reject(Error('Empty image'));};im.onerror=()=>reject(Error('Missing photo: '+s.name));im.src=image.getAttribute('src');});
  }
  check(gaugeName({id:'02339400',name:'02339400'}).startsWith('West Point Lake'),'Cached numeric lake gauge gets a friendly name');
  check(gaugeName({id:'02339402',name:'02339402'}).includes('below West Point Dam'),'Cached numeric river gauge gets a friendly name');
  document.querySelector('#results').textContent=lines.join('\n')+'\nALL CHECKS PASSED';
}catch(e){document.querySelector('#results').textContent=lines.join('\n')+'\nFAIL: '+e.stack;}
</script></html>
